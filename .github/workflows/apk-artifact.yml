name: LK Stickwerk APK Artifact

on:
  push:
    branches: [ main ]
    paths:
      - 'downloads/LK-Stickwerk-Control-v1.apk'
      - '.github/workflows/apk-artifact.yml'
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LK-Stickwerk-Control-v1
          path: downloads/LK-Stickwerk-Control-v1.apk
          if-no-files-found: error
