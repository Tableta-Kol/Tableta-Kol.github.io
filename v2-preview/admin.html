
<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LK Stickwerk Control v2</title><link rel="stylesheet" href="styles.css"></head><body>
<div class="wrap"><header class="top"><div class="brand"><div class="logo">LK</div><div><h1>LK Stickwerk Control v2</h1><div class="sub">Panel właściciela, preview</div></div></div><a class="btn secondary" href="customer.html">Formularz klienta</a></header>
<div class="grid"><section class="card"><div class="kpis"><div class="kpi"><b id="kNew">0</b><span>NOWE</span></div><div class="kpi"><b id="kQuote">0</b><span>WYCENA</span></div><div class="kpi"><b id="kApproved">0</b><span>ZATWIERDZONE</span></div><div class="kpi"><b id="kReady">0</b><span>GOTOWE</span></div></div></section>
<section class="card"><h2>Aktualizacje</h2><div class="meta"><span>Wersja lokalna: <strong id="currentVersion"></strong></span><span id="updateState">Nie sprawdzano</span></div><div class="actions"><button class="secondary" id="checkUpdate">Sprawdź aktualizację</button></div><div class="small" id="updateInfo">Preview sprawdza manifest wersji. Instalacja APK nie jest jeszcze aktywna.</div></section>
<section class="card"><div class="toolbar"><input id="search" placeholder="Szukaj po ID, kliencie, firmie..."><select id="statusFilter"><option value="">Wszystkie statusy</option><option>NEW</option><option>QUOTE</option><option>APPROVED</option><option>EMBROIDERY</option><option>READY</option><option>SHIPPED</option><option>CANCELLED</option></select><button class="secondary" id="seed">Dodaj zamówienie testowe</button></div><div id="orders" class="orders"></div></section></div></div>
<script src="app.js"></script><script>
const el=id=>document.getElementById(id);const labels={NEW:"NOWE",QUOTE:"WYCENA",APPROVED:"ZATWIERDZONE",EMBROIDERY:"HAFTOWANIE",READY:"GOTOWE",SHIPPED:"WYSŁANE",CANCELLED:"ANULOWANE"};
function setStatus(id,s){const a=LK.loadOrders(),o=a.find(x=>x.id===id);if(!o)return;o.status=s;o.updatedAt=LK.nowIso();LK.saveOrders(a);render()}function removeOrder(id){if(confirm("Usunąć "+id+"?")){LK.saveOrders(LK.loadOrders().filter(x=>x.id!==id));render()}}
function render(){let a=LK.loadOrders(),q=el("search").value.trim().toLowerCase(),sf=el("statusFilter").value;el("kNew").textContent=a.filter(o=>o.status==="NEW").length;el("kQuote").textContent=a.filter(o=>o.status==="QUOTE").length;el("kApproved").textContent=a.filter(o=>o.status==="APPROVED").length;el("kReady").textContent=a.filter(o=>o.status==="READY").length;a=a.filter(o=>(!q||[o.id,o.customer?.displayName,o.customer?.company,o.items?.[0]?.textileType].join(" ").toLowerCase().includes(q))&&(!sf||o.status===sf));el("orders").innerHTML=a.length?a.map(o=>{const i=o.items?.[0]||{};return '<article class="order"><div class="order-head"><div><strong>'+o.id+'</strong><div>'+(o.customer?.company||o.customer?.displayName||"Klient")+'</div></div><span class="badge">'+(labels[o.status]||o.status)+'</span></div><div class="meta"><span>'+(i.textileType||"")+'</span><span>'+(i.quantity||0)+' szt.</span><span>'+(i.color||"")+'</span><span>'+(o.embroidery?.placement||"")+'</span></div><div class="actions"><button class="secondary" onclick="setStatus(\''+o.id+'\',\'QUOTE\')">Wycena</button><button class="secondary" onclick="setStatus(\''+o.id+'\',\'APPROVED\')">Zatwierdzone</button><button class="secondary" onclick="setStatus(\''+o.id+'\',\'EMBROIDERY\')">Haftowanie</button><button class="secondary" onclick="setStatus(\''+o.id+'\',\'READY\')">Gotowe</button><button class="secondary" onclick="setStatus(\''+o.id+'\',\'SHIPPED\')">Wysłane</button><button class="danger" onclick="removeOrder(\''+o.id+'\')">Usuń</button></div></article>'}).join(""):'<div class="empty">Brak zamówień do wyświetlenia.</div>'}
el("search").oninput=render;el("statusFilter").onchange=render;el("currentVersion").textContent=LK.CURRENT_VERSION.name;el("checkUpdate").onclick=async()=>{try{const r=await LK.checkForUpdate();el("updateState").textContent=r.available?"Dostępna "+r.remote.versionName:"Masz najnowszą wersję";el("updateInfo").textContent=(r.remote.releaseNotes||[]).join(" • ")}catch(e){el("updateState").textContent="Błąd";el("updateInfo").textContent=e.message}};
el("seed").onclick=()=>{const a=LK.loadOrders();a.unshift({id:LK.makeId(),status:"NEW",customer:{displayName:"Test Kunde",company:"Muster GmbH"},items:[{textileType:"Polo",quantity:5,color:"Schwarz"}],embroidery:{placement:"Brust links"},attachments:[],createdAt:LK.nowIso(),updatedAt:LK.nowIso(),schemaVersion:1});LK.saveOrders(a);render()};render();
</script></body></html>
